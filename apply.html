<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지원하기 - MoveAX</title>
  <link rel="stylesheet" href="css/styless.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="logo">Move<span>AX</span></a>
      <nav class="menu">
        <a href="index.html">홈</a>
        <a href="recruit.html">모집요강</a>
        <a href="apply.html" class="active">지원</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <section class="page-head">
    <div class="container">
      <h1>지원하기</h1>
      <p>1분이면 끝나요. 필수 항목 5개만 입력해 주세요.</p>
    </div>
  </section>

  <main class="form">
    <div class="steps">
      <div class="step on" id="s1">① 정보 입력</div>
      <div class="step" id="s2">② 제출 완료</div>
    </div>

    <form id="applyForm">
      <div class="field">
        <label for="job">지원 직무</label>
        <select id="job" required>
          <option value="">직무를 선택하세요</option>
          <option>운영관리</option>
          <option>물류 IT 개발</option>
          <option>배차</option>
          <option>영업</option>
          <option>현장 관리자</option>
        </select>
      </div>
      <div class="field">
        <label for="name">이름</label>
        <input id="name" type="text" placeholder="홍길동" required>
      </div>
      <div class="field">
        <label for="phone">연락처</label>
        <input id="phone" type="tel" placeholder="010-0000-0000" pattern="01[0-9]-?[0-9]{3,4}-?[0-9]{4}" required>
      </div>
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" placeholder="name@example.com" required>
      </div>
      <div class="field">
        <label for="intro">한 줄 지원 동기 (선택)</label>
        <textarea id="intro" rows="3" maxlength="200" placeholder="자유롭게 적어주세요."></textarea>
      </div>
      <label class="agree"><input type="checkbox" required> 개인정보 수집·이용에 동의합니다. (채용 목적, 6개월 보관)</label>
      <button type="submit" class="btn full">지원서 제출</button>
    </form>

    <div class="done" id="done">
      <h2>🎉 지원이 완료되었습니다</h2>
      <p id="doneMsg"></p>
      <p style="margin:12px 0 24px;color:var(--muted)">서류 검토 후 영업일 기준 7일 이내 연락드립니다.</p>
      <a href="index.html" class="btn">홈으로</a>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p><b>MoveAX (무브에이엑스)</b> · 채용 문의 recruit@moveax.example</p>
      <p>© 2026 MoveAX. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // 모집요강에서 넘어온 직무를 미리 선택
    const preset = new URLSearchParams(location.search).get("job");
    if (preset) document.getElementById("job").value = preset;

    document.getElementById("applyForm").addEventListener("submit", e => {
      e.preventDefault();
      // 데모용: 실제 서버 전송은 없습니다. 백엔드 연결 시 이 부분에서 fetch 사용.
      document.getElementById("doneMsg").textContent =
        document.getElementById("name").value + "님, [" + document.getElementById("job").value + "] 지원서가 접수되었습니다.";
      e.target.style.display = "none";
      document.getElementById("done").style.display = "block";
      document.getElementById("s1").classList.remove("on");
      document.getElementById("s2").classList.add("on");
    });
  </script>
</body>
</html>
